<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Hotline</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- DaisyUI & Tailwind CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        crossorigin="anonymous" />
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header Section -->
    <header class="bg-white border-b border-gray-200 p-4 sticky top-0 z-50 flex justify-between items-center">

        <div class="flex items-center gap-2">
            <img src="images/logo.png" alt="Logo" class="w-8 h-8 object-contain">
            <h1 class="text-base font-bold text-emerald-800 sm:text-xl">Emergency Service</h1>
        </div>

        <div class="flex items-center gap-2">
            <div
                class="flex items-center gap-1 bg-emerald-50 border border-emerald-200 px-2 py-1 rounded-full text-sm sm:text-base font-semibold">
                <span id="heart-count">0</span>
                <span class="text-red-500">❤️</span>
            </div>

            <div
                class="flex items-center gap-1 bg-yellow-50 border border-yellow-200 px-2 py-1 rounded-full text-sm sm:text-base font-bold text-yellow-800">
                <span id="coin-count">100</span>
                <img src="images/coin.png" alt="Coin" class="w-4 h-4 object-contain">
            </div>

            <div
                class="flex items-center gap-1 bg-emerald-600 text-white px-3 py-1 rounded-full text-sm sm:text-base font-semibold">
                <span id="copy-count">0</span>
                <span>Copy</span>
            </div>
        </div>
    </header>

    <main>

    </main>
    <script src="script.js"></script>
</body>

</html>
